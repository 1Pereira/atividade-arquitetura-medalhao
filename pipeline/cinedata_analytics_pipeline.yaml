resources:
  jobs:
    cinedata_analytics_pipeline:
      name: cinedata_analytics_pipeline
      tasks:
        - task_key: 00_organizacao_ambiente
          notebook_task:
            notebook_path: /Workspace/Rocket_Lab/Atividade 2/00_Organizacao_do_Ambiente
            source: WORKSPACE
        - task_key: 01_ingestao_bronze
          depends_on:
            - task_key: 00_organizacao_ambiente
          notebook_task:
            notebook_path: /Workspace/Rocket_Lab/Atividade 2/01_Ingestao_Bronze
            source: WORKSPACE
        - task_key: 02_bronze_to_silver
          depends_on:
            - task_key: 01_ingestao_bronze
          notebook_task:
            notebook_path: /Workspace/Rocket_Lab/Atividade 2/02_Bronze_to_Silver
            source: WORKSPACE
        - task_key: 03_silver_to_gold
          depends_on:
            - task_key: 02_bronze_to_silver
          notebook_task:
            notebook_path: /Workspace/Rocket_Lab/Atividade 2/03_Silver_to_Gold
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
